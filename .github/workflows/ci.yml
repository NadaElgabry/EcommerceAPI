name: deploy-EcommerceAPI

on:
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore dependencies
        run: dotnet restore EcommerceAPI.slnx

      - name: Build
        run: dotnet build EcommerceAPI.slnx --no-restore --configuration Release

      - name: Check formatting
        run: dotnet format EcommerceAPI.slnx --verify-no-changes --no-restore
        continue-on-error: true

      - name: Run tests
        run: dotnet test EcommerceAPI.slnx --no-build --configuration Release --verbosity normal

  docker-build-and-push:
    runs-on: self-hosted
    needs: build-and-test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: self-hosted
    needs: docker-build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):latest" >> "$GITHUB_OUTPUT"

      - name: Write .env file
        run: |
          cat > .env <<EOF
          DB_SA_PASSWORD=${{ secrets.DB_SA_PASSWORD }}
          EOF

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Pull latest image
        run: |
          docker pull "${{ steps.image.outputs.name }}"

      - name: Deploy with Docker Compose
        run: |
          IMAGE="${{ steps.image.outputs.name }}" \
            docker compose up -d --pull always --remove-orphans
