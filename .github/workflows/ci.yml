name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore EcommerceAPI.slnx

      - name: Build
        run: dotnet build EcommerceAPI.slnx --no-restore --configuration Release

      - name: Check formatting
        run: dotnet format EcommerceAPI.slnx --verify-no-changes --no-restore
        continue-on-error: true 

      - name: Run tests
        run: dotnet test EcommerceAPI.slnx --no-build --configuration Release --verbosity normal
