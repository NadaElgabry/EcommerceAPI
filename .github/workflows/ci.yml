name: deploy-EcommerceAPI

on:
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore dependencies
        run: dotnet restore EcommerceAPI.slnx

      - name: Build
        run: dotnet build EcommerceAPI.slnx --no-restore --configuration Release

      - name: Check formatting
        run: dotnet format EcommerceAPI.slnx --verify-no-changes --no-restore
        continue-on-error: true

      - name: Run tests
        run: dotnet test EcommerceAPI.slnx --no-build --configuration Release --verbosity normal

  docker-build-and-push:
    runs-on: self-hosted
    needs: build-and-test

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: |
          REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          SHA=sha-$(echo '${{ github.sha }}' | cut -c1-7)

          echo "name=ghcr.io/${REPO}:${SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}

  deploy:
    runs-on: self-hosted
    needs: docker-build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write .env file
        run: |
          cat > .env <<EOF
          DB_SA_PASSWORD=${{ secrets.DB_SA_PASSWORD }}
          EOF

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Pull image
        run: |
          docker pull "${{ needs.docker-build-and-push.outputs.image }}"

      - name: Deploy with Docker Compose
        run: |
          IMAGE="${{ needs.docker-build-and-push.outputs.image }}" \
            docker compose up -d --pull always --remove-orphans
