services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.2
    container_name: ecommerce-es-local
    environment:
      discovery.type: "single-node"
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-local-data:/usr/share/elasticsearch/data
    networks:
      - ecommerce-local-network

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.2
    container_name: ecommerce-kibana-local
    depends_on:
      - elasticsearch
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
    ports:
      - "5601:5601"
    networks:
      - ecommerce-local-network

volumes:
  es-local-data:

networks:
  ecommerce-local-network:
    driver: bridge